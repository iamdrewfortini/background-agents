<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WRC Embed Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
      }
    </style>
  </head>
  <body>
    <div id="logo" style="width: 420px; height: 340px"></div>
    <script src="./dist/wrc-runclub-embed.umd.js"></script>
    <script>
      window.WrcRunClubEmbed.create(document.getElementById('logo'), {
        clubName: 'WRC',
        textColor: '#ffffff',
        starColor: '#ffffff',
        shoeColor: '#ffffff'
      });
    </script>
  </body>
</html>
